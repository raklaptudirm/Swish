name: CI

# Builds and tests Swish where it's meant to run: macOS and Linux. The same
# steps as `run test` (Tasks.swish): both packages' unit tests, then the
# shell driven through a real terminal by the expect scripts.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The terminal tests expect a color terminal, as a person's would be.
  TERM: xterm-256color

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The bridges in Sources/SwishCore/Bridge/Generated are read from this
      # Swift's symbol graphs, so the newest Xcode is the one they match.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/cache@v4
        with:
          path: |
            .build
            Packages/SwishKit/.build
            Examples/Tools/.build
          # The manifests, not `**`, which would walk into .build.
          key: macos-${{ runner.arch }}-swift-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/*/Package.swift', 'Examples/*/Package.swift') }}
          restore-keys: macos-${{ runner.arch }}-swift-

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test

      - name: SwishKit unit tests
        run: swift test --package-path Packages/SwishKit

      - name: Terminal tests
        run: |
          # Every script runs, so one failure doesn't hide the others.
          status=0
          for script in job-control line-editor background-jobs config signals; do
            expect "Tests/Interactive/$script.exp" || status=1
          done
          exit $status

  linux:
    name: Linux
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 60
    steps:
      # expect drives the terminal tests; python3 is the program a few of them
      # run (it reads the terminal the way vim or less do).
      - name: Install expect and python3
        run: |
          apt-get update && apt-get install -y expect python3
          python3 --version

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            .build
            Packages/SwishKit/.build
            Examples/Tools/.build
          key: linux-${{ runner.arch }}-swift-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/*/Package.swift', 'Examples/*/Package.swift') }}
          restore-keys: linux-${{ runner.arch }}-swift-

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test

      - name: SwishKit unit tests
        run: swift test --package-path Packages/SwishKit

      - name: Terminal tests
        run: |
          # Every script runs, so one failure doesn't hide the others.
          status=0
          for script in job-control line-editor background-jobs config signals; do
            expect "Tests/Interactive/$script.exp" || status=1
          done
          exit $status

  # The bridges (Sources/SwishCore/Bridge/Generated) are made from symbol
  # graphs, and a graph is read on the platform it's made on. Each platform's
  # members are kept in Bridges/<platform>, and only what all of them have is
  # bridged, so a member one platform lacks can't break the build on another.

  bridges-macos:
    name: Bridges (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/cache@v4
        with:
          path: |
            .build
            Packages/SwishKit/.build
          key: bridges-macos-${{ runner.arch }}-swift-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/*/Package.swift', 'Examples/*/Package.swift') }}
          restore-keys: bridges-macos-${{ runner.arch }}-swift-

      - name: Build
        run: swift build

      # Generating again must change nothing: otherwise the generator, the
      # toolchain or a manifest changed and the bridges weren't remade.
      - name: Bridges are current
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          .build/debug/swish -c 'run bridge'
          changes=$(git status --porcelain -- Sources Bridges)
          if [ -n "$changes" ]; then
            git status --short -- Sources Bridges
            git diff --stat -- Sources Bridges
            echo "::error::The bridges are out of date: run 'swift run swish -c \"run bridge\"' and commit the result."
            exit 1
          fi

  bridges-linux:
    name: Bridges (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 60
    steps:
      - name: Install python3
        run: apt-get update && apt-get install -y python3

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            .build
            Packages/SwishKit/.build
          key: bridges-linux-${{ runner.arch }}-swift-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/*/Package.swift', 'Examples/*/Package.swift') }}
          restore-keys: bridges-linux-${{ runner.arch }}-swift-

      - name: Build
        run: swift build

      # Why the generator bridges fewer members from Linux's graphs: each
      # type's members left out, by reason. (Temporary.)
      - name: Why Linux bridges less
        continue-on-error: true
        run: |
          B=$(swift build --show-bin-path)
          swift build --product swish-bridge
          G=/tmp/diag; mkdir -p $G
          for m in Swift _StringProcessing; do
            swift-symbolgraph-extract -module-name $m -target "$(uname -m)-unknown-linux-gnu" -output-dir $G
          done
          ls $G
          for type in Range Substring Set; do
            echo "== $type"
            SWISH_BRIDGE_DEBUG=$type $B/swish-bridge $G/Swift.symbols.json /tmp/diag.swift $G/_StringProcessing@Swift.symbols.json 2>&1 \
              | grep -vE "^bridged" | sed -E 's/^[^:]*: //' | sort | uniq -c | sort -rn | head -14
          done

      # Linux's graphs can only be read on Linux, so this makes its manifests.
      - name: Make Linux's manifests
        run: .build/debug/swish -c 'run bridge'

      # What this platform has, for whoever commits it (`gh run download`).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridges-linux
          path: Bridges/linux

      - name: Manifests are current
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          changes=$(git status --porcelain -- Bridges/linux)
          if [ -n "$changes" ]; then
            git status --short -- Bridges/linux
            git diff --stat -- Bridges/linux
            echo "::error::Linux's bridge manifests changed: download the bridges-linux artifact into Bridges/linux, run the bridge task on macOS, and commit."
            exit 1
          fi
