name: CI

# Builds and tests Swish where it's meant to run: macOS and Linux. The same
# steps as `run test` (Tasks.swish): the shell's unit tests, then the
# shell driven through a real terminal by the expect scripts.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The terminal tests expect a color terminal, as a person's would be.
  TERM: xterm-256color

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Swiit, the interpreter, lives in a repository of its own, and the
      # manifest looks for it beside this one. .swiit-version is the tag this
      # shell is built against.
      - name: Swiit
        run: |
          git clone https://github.com/raklaptudirm/Swiit.git ../Swiit
          git -C ../Swiit checkout "$(cat .swiit-version)"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/cache@v4
        with:
          path: |
            .build
          # The manifests, not `**`, which would walk into .build.
          key: macos-${{ runner.arch }}-swift-${{ hashFiles('Package.swift', 'Package.resolved', '.swiit-version') }}
          restore-keys: macos-${{ runner.arch }}-swift-

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test

      - name: Terminal tests
        run: |
          # Every script runs, so one failure doesn't hide the others.
          status=0
          for script in job-control line-editor background-jobs config signals; do
            expect "Tests/Interactive/$script.exp" || status=1
          done
          exit $status

  linux:
    name: Linux
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 60
    steps:
      # expect drives the terminal tests; python3 is the program a few of them
      # run (it reads the terminal the way vim or less do).
      - name: Install expect and python3
        run: |
          apt-get update && apt-get install -y expect python3
          python3 --version

      - uses: actions/checkout@v4

      # Swiit, the interpreter, lives in a repository of its own, and the
      # manifest looks for it beside this one. .swiit-version is the tag this
      # shell is built against.
      - name: Swiit
        run: |
          git clone https://github.com/raklaptudirm/Swiit.git ../Swiit
          git -C ../Swiit checkout "$(cat .swiit-version)"

      - uses: actions/cache@v4
        with:
          path: |
            .build
          key: linux-${{ runner.arch }}-swift-${{ hashFiles('Package.swift', 'Package.resolved', '.swiit-version') }}
          restore-keys: linux-${{ runner.arch }}-swift-

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test

      - name: Terminal tests
        run: |
          # Every script runs, so one failure doesn't hide the others.
          status=0
          for script in job-control line-editor background-jobs config signals; do
            expect "Tests/Interactive/$script.exp" || status=1
          done
          exit $status
